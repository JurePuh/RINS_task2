detect_barrel_cpp:
  ros__parameters:
    image_topic: /oakd/rgb/preview/image_raw
    point_cloud_topic: /oakd/rgb/preview/depth/points
    target_frame: map

    barrel_topic: /barrel_detect
    marker_topic: /barrel_markers
    debug_overlay_topic: /barrel/debug_overlay
    debug_mask_topic: /barrel/debug_mask
    debug_rejection_topic: /barrel/debug_rejections
    debug_depth_alignment_topic: /barrel/debug_depth_alignment
    debug_depth_validity_topic: /barrel/debug_depth_validity
    debug_leak_overlay_topic: /barrel/debug_leak_overlay

    publish_hz: 2.0
    sync_queue_size: 5
    sync_slop_s: 0.08
    first_track_id: 100
    accept_threshold: 20
    dedup_distance_m: 0.40
    dedup_distance_m.black: 3.0
    dedup_distance_m.red: 2.0
    dedup_distance_m.green: 0.4
    dedup_distance_m.yellow: 5.0
    dedup_distance_m.blue: 5.0
    republish_move_threshold_m: 0.05
    republish_rotation_threshold_rad: 0.1
    track_timeout_frames: 150
    max_barrel_height_m: 0.42

    depth_min_m: -0.20
    depth_max_m: -0.07
    cluster_tolerance_m: 0.07
    cluster_min_points: 40
    cluster_max_points: 20000

    candidate_min_3d_largest_extent_m: 0.250
    candidate_max_3d_largest_extent_m: 0.9
    candidate_min_3d_middle_extent_m: 0.10
    candidate_min_3d_depth_extent_m: 0.06
    candidate_min_3d_depth_to_middle_ratio: 0.10
    candidate_min_3d_middle_largest_ratio: 0.15
    candidate_max_3d_middle_largest_ratio: 1.05

    normal_search_radius_m: 0.05
    ransac_max_iterations: 250
    ransac_distance_threshold_m: 0.035
    ransac_normal_distance_weight: 0.1
    cylinder_radius_min_m: 0.08
    cylinder_radius_max_m: 0.45

    cylinder_inlier_min: 25 #35

    cylinder_fit_residual_max_m: 0.08 #0.05

    vertical_dot_threshold: 0.75
    horizontal_dot_threshold: 0.35

    candidate_min_area_px: 180.0
    candidate_max_area_px: 90000.0
    candidate_min_width_px: 12
    candidate_min_height_px: 12

    color_confidence_min: 0.25 #0.45

    mask_morph_open_kernel: 3

    mask_morph_close_kernel: 3 #9

    hsv_ranges.red: [0, 90, 40, 10, 255, 255, 160, 90, 40, 179, 255, 255]
    hsv_ranges.green: [35, 70, 35, 90, 255, 255]
    hsv_ranges.blue: [90, 60, 35, 140, 255, 255]
    hsv_ranges.yellow: [16, 80, 50, 35, 255, 255]
    hsv_ranges.black: [0, 0, 0, 179, 255, 55]

    stability_window_m: 8

    marker_scale_x: 0.28
    marker_scale_y: 0.28
    marker_scale_z: 0.45
    marker_alpha: 0.9
    marker_lifetime_s: 1.5
    marker_namespace: barrels

    enable_debug_overlay: true
    enable_debug_mask: true
    enable_debug_rejections: true
    enable_debug_rejection_log: true
    enable_debug_depth_alignment: true
    enable_debug_depth_validity: true

    enable_debug_leak_overlay: true
    leak_search_padding_px: 60
    leak_mask_morph_open_kernel: 3
    leak_mask_morph_close_kernel: 7
    leak_min_area_px: 200.0
    leak_max_area_px: 20000.0
    leak_min_fill_ratio: 0.45
    leak_min_circularity: 0.30
    leak_min_axis_ratio: 0.25
    leak_min_points: 15
    leak_min_height_m: 0.005
    leak_max_height_m: 0.08
    leak_source_z_min_m: -0.24
    leak_source_z_max_m: -0.21
    leak_source_z_inlier_ratio_min: 0.85
    leak_max_thickness_m: 0.05
    leak_max_distance_from_barrel_m: 0.85
    leak_horizontal_barrels_only: true
    leak_confirm_threshold: 3
    leak_clear_threshold: 3

    debug_depth_alignment_search_px: 50
    debug_depth_alignment_step_px: 5
    debug_window_name: barrel
    debug_mask_window_name: barrel_mask
    debug_rejection_window_name: barrel_rejections
    debug_depth_alignment_window_name: barrel_depth_alignment
    debug_depth_validity_window_name: barrel_depth_validity
    debug_leak_window_name: barrel_leak
    show_debug_window: false
    draw_barrel_outline: true
    draw_blob_metrics: true
    draw_track_ids: true
    draw_normal_arrow: true
